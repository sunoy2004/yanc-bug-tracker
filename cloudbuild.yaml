options:
  substitutionOption: ALLOW_LOOSE

substitutions:
  _SERVICE: "yanc-bug-tracker"
  _REGION: "us-central1"

steps:
  # Build the frontend
  - name: 'node:18-alpine'
    id: 'build'
    entrypoint: 'sh'
    args:
      - -c
      - |
        npm install --legacy-peer-deps
        npm run build

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker_build'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA', '.']

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker_push'
    args: ['push', 'gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy'
    entrypoint: 'bash'
    args:
      - -c
      - |
        gcloud run deploy ${_SERVICE} --image gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA --region ${_REGION} --platform managed --allow-unauthenticated

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA'

